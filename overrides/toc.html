<div class="navbar-light navbar-expand-md bs-sidebar hidden-print affix"
     role="complementary">

  {% if page and page.file.src_uri in ['assignments.md', 'assignment-2.md'] %}
  <div style="padding: 12px 20px; border-bottom: 1px solid #ddd;">
    <strong>Assignments</strong>

    <a href="{{ 'assignments.md' | url }}"
       style="display: block; padding: 8px 0;
       {% if page.file.src_uri == 'assignments.md' %}font-weight: bold;{% endif %}">
      Assignment 1
    </a>

    <a href="{{ 'assignment-2/' | url }}"
       style="display: block; padding: 8px 0;
       {% if page.file.src_uri == 'assignment-2.md' %}font-weight: bold;{% endif %}">
      Assignment 2
    </a>
  </div>
  {% endif %}

  <ul class="nav flex-column bs-sidenav">
    {% for item in page.toc recursive %}
    <li class="nav-item">
      <a class="nav-link" href="{{ item.url }}">{{ item.title }}</a>
      {% if item.children %}
      <ul class="nav flex-column">
        {{ loop(item.children) }}
      </ul>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</div>
